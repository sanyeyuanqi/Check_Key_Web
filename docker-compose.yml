services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: docker.m.daocloud.io/library/redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      CACHE_REDIS_URL: ${CACHE_REDIS_URL-redis://redis:6379/1}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-10}
      CACHE_STATISTICS_TTL_SECONDS: ${CACHE_STATISTICS_TTL_SECONDS:-60}
      QUEUE_BATCH_RECORDS: ${QUEUE_BATCH_RECORDS:-1000}
      QUEUE_BATCH_WAIT_SECONDS: ${QUEUE_BATCH_WAIT_SECONDS:-30}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: 60s
    env_file: .env
    environment:
      CACHE_REDIS_URL: ${CACHE_REDIS_URL-redis://redis:6379/1}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-10}
      CACHE_STATISTICS_TTL_SECONDS: ${CACHE_STATISTICS_TTL_SECONDS:-60}
      QUEUE_BATCH_RECORDS: ${QUEUE_BATCH_RECORDS:-1000}
      QUEUE_BATCH_WAIT_SECONDS: ${QUEUE_BATCH_WAIT_SECONDS:-30}
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres18_data:
  redis_data:
